services:
  postgres:
    image: postgres:16-alpine
    container_name: buddyscript-postgres
    environment:
      POSTGRES_USER: buddyscript
      POSTGRES_PASSWORD: buddyscript
      POSTGRES_DB: buddyscript
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - buddyscript_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddyscript -d buddyscript"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  buddyscript_pgdata:
